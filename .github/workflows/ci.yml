name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend-lint:
    name: backend · ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  backend-typecheck:
    name: backend · mypy strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run mypy

  backend-test:
    name: backend · pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run pytest -q

  backend-import-linter:
    name: backend · import-linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run lint-imports

  backend-eval-baseline:
    name: backend · eval baseline (B family)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      # 确定性派生 B 族实机执行，零 token；B 失败即 exit 1（06-eval-spec §6.2）。
      # 投毒/权限回归由 pytest 评测门（test_eval_gate，C 族全量 ci 标记）覆盖。
      - run: uv run python scripts/run_eval.py

  frontend:
    name: frontend · lint + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm lint
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      - run: pnpm build:widget
        working-directory: frontend

  repo-policy:
    name: repo policy check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv run python scripts/check_repo_policy.py

  rag-pgvector:
    name: rag · pgvector acceptance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rfq
          POSTGRES_PASSWORD: rfq
          POSTGRES_DB: rfq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rfq"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run python scripts/ingest_demo_knowledge.py --pg --dsn postgresql://rfq:rfq@localhost:5432/rfq
